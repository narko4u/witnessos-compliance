[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aci-spec"
version = "0.1.0"
description = "Agent Capability Interface — open standard for AI agent capability discovery and interoperability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "agents", "standards", "capabilities", "interoperability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/narko4u/agent-interaction-specs"
Repository = "https://github.com/narko4u/agent-interaction-specs"

[tool.setuptools.packages.find]
where = ["src"]
